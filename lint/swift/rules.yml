  - id: deep-view-nesting
    check: viewNesting
    config: { max: 7 }
    message: "This view builder nests more than 7 levels deep (views, branches and action closures), which hides the layout and makes every change touch the whole tree. Extract the inner levels into their own View structs named for what they show, and move action logic into methods."
    bad:
      - |-
        struct Feed: View {
            var body: some View {
                ScrollView {
                    VStack {
                        ForEach(posts) { post in
                            HStack {
                                VStack {
                                    if post.isPinned {
                                        Button {
                                            withAnimation { pin(post) }
                                        } label: { Text("Pin") }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
    good:
      - |-
        struct Feed: View {
            var body: some View {
                ScrollView {
                    VStack {
                        ForEach(posts) { post in PostRow(post: post) }
                    }
                }
            }
        }

  - id: too-many-state
    check: stateCount
    config: { max: 12 }
    message: "This view holds more than 12 @State properties, so it is doing the work of several screens and any of them can redraw all of it. Move the related ones into an @Observable model the view owns, or split the screen into child views that each own their own state."
    bad:
      - |-
        struct Checkout: View {
            @State private var a = 0
            @State private var b = 0
            @State private var c = 0
            @State private var d = 0
            @State private var e = 0
            @State private var f = 0
            @State private var g = 0
            @State private var h = 0
            @State private var i = 0
            @State private var j = 0
            @State private var k = 0
            @State private var l = 0
            @State private var m = 0
            var body: some View { Text("") }
        }
    good:
      - |-
        struct Checkout: View {
            @State private var model = CheckoutModel()
            @StateObject private var cart = Cart()
            var body: some View { Text("") }
        }

  - id: no-notification-bus
    regex: '\b(?:NS)?Notification\.Name\(\s*(?:rawValue:\s*)?"'
    skipKinds: [comment, doccomment]
    message: "A custom notification turns NotificationCenter into an untyped, app-wide event bus: anything can post it, nothing says who listens, and the payload is an untyped userInfo. Call the owner directly: pass a closure or a @Binding, share an @Observable model through the environment, or expose an AsyncStream from the object that has the event. (System notifications such as UIApplication.didBecomeActiveNotification are fine.)"
    bad:
      - 'NotificationCenter.default.post(name: NSNotification.Name("RefreshHabits"), object: nil)'
      - |-
        extension Notification.Name {
            static let profileChanged = Notification.Name("profileChanged")
        }
    good:
      - '.onReceive(NotificationCenter.default.publisher(for: UIApplication.didBecomeActiveNotification)) { _ in refresh() }'

  - id: no-discarded-observer
    swiftlint: discarded_notification_center_observer
    message: "The token from addObserver(forName:object:queue:using:) is the only way to remove this observer, and it is thrown away: the closure runs for the life of the app, and a copy is added every time this code runs again. In SwiftUI use .onReceive(NotificationCenter.default.publisher(for:)); elsewhere keep the token and remove it, or loop over NotificationCenter.default.notifications(named:) in a task that is cancelled."
    bad:
      - |-
        func listen() {
            NotificationCenter.default.addObserver(forName: .NSCalendarDayChanged, object: nil, queue: .main) { _ in refresh() }
        }
    good:
      - |-
        func listen() {
            observer = NotificationCenter.default.addObserver(forName: .NSCalendarDayChanged, object: nil, queue: .main) { _ in refresh() }
        }

  - id: no-singleton-state
    check: singletonState
    config: {}
    message: "This shared instance has settable properties, so any file can change them at any time: it is a global variable, and the bugs it causes show up far from the line that caused them. Make the properties private(set) and change them through methods on the type, or create the object once at the app's root and pass it down (environment or init). A `static var shared` can itself be replaced: make it `static let`."
    bad:
      - |-
        final class Session {
            static let shared = Session()
            var currentUser: User?
            private init() {}
        }
      - |-
        final class Router: ObservableObject {
            static var shared = Router()
            @Published private(set) var path: [Route] = []
        }
    good:
      - |-
        final class Session {
            static let shared = Session()
            private(set) var currentUser: User?
            var isSignedIn: Bool { currentUser != nil }
            private init() {}
            func signIn(_ user: User) { currentUser = user }
        }
      - |-
        actor ImageCache {
            static let shared = ImageCache()
            var images: [URL: Data] = [:]
        }

  - id: no-strong-self-capture
    check: strongSelfCapture
    config: {}
    message: "This closure is kept alive by a Combine subscription, a NotificationCenter observer or a repeating Timer, and it captures self strongly, so self is never freed (a retain cycle) and keeps reacting after its screen is gone. Capture `[weak self]` and start with `guard let self else { return }`; for Combine, `.assign(to: &$property)` needs no self at all."
    bad:
      - |-
        final class FeedModel: ObservableObject {
            @Published var posts: [Post] = []
            private var cancellables: Set<AnyCancellable> = []
            func start() {
                service.posts
                    .sink { posts in
                        self.posts = posts
                    }
                    .store(in: &cancellables)
            }
        }
      - |-
        final class Clock {
            var ticks = 0
            var timer: Timer?
            func start() {
                timer = Timer.scheduledTimer(withTimeInterval: 1, repeats: true) { _ in self.ticks += 1 }
            }
        }
      - |-
        final class Profile: ObservableObject {
            @Published var name = ""
            func bind() { service.name.assign(to: \.name, on: self).store(in: &cancellables) }
        }
    good:
      - |-
        final class FeedModel: ObservableObject {
            @Published var posts: [Post] = []
            private var cancellables: Set<AnyCancellable> = []
            func start() {
                service.posts
                    .sink { [weak self] posts in
                        self?.posts = posts
                    }
                    .store(in: &cancellables)
            }
        }
      - |-
        struct Clock: View {
            @State private var ticks = 0
            var body: some View {
                Text("\(ticks)").onAppear {
                    _ = Timer.scheduledTimer(withTimeInterval: 1, repeats: true) { _ in print(self.ticks) }
                }
            }
        }
      - |-
        final class Splash {
            func start() {
                Timer.scheduledTimer(withTimeInterval: 1, repeats: false) { _ in self.finish() }
            }
        }

  - id: no-main-queue-hop
    check: mainActorDispatch
    config: {}
    message: "This code already runs on the main actor (a SwiftUI view, a UIKit view or controller, or a @MainActor type), so DispatchQueue.main.async (or MainActor.run) only pushes the work to a later turn of the run loop. Call it directly. If it only works deferred, the state is being set at the wrong moment: react to it with .onChange or .task(id:) instead."
    bad:
      - |-
        struct Player: View {
            @State private var isReady = false
            var body: some View {
                Text("Ready").onAppear {
                    DispatchQueue.main.async { isReady = true }
                }
            }
        }
      - |-
        @MainActor
        final class FeedModel: ObservableObject {
            @Published var posts: [Post] = []
            func reload() async {
                let fresh = await api.posts()
                await MainActor.run { posts = fresh }
            }
        }
      - |-
        final class PhotoViewController: UIViewController {
            func show(_ image: UIImage) {
                if isViewLoaded {
                    DispatchQueue.main.async { self.imageView.image = image }
                }
            }
        }
    good:
      - |-
        struct Player: View {
            @State private var isReady = false
            var body: some View {
                Text("Ready").onAppear {
                    loader.load { result in
                        DispatchQueue.main.async { isReady = true }
                    }
                }
            }
        }
      - |-
        final class Downloader {
            func finish(_ data: Data) {
                DispatchQueue.main.async { self.onDone?(data) }
            }
        }
      - |-
        @MainActor
        final class FeedModel {
            nonisolated func receive(_ posts: [Post]) {
                DispatchQueue.main.async { self.apply(posts) }
            }
        }

  - id: no-generic-mark
    regex: '//[ \t]*MARK:[ \t]*-?[ \t]*(?:(?:Public|Private|Internal|Fileprivate|Published|Computed|Stored|Static|Helper|Supporting|Utility|Other|View|UI)[ \t]+)*(?:Properties|Property|Vars|Variables|Methods|Functions|Funcs|Helpers?|Init|Inits|Initiali[sz]ers?|Initiali[sz]ation|Lifecycle|Body|Views?|Subviews|Previews?|Preview[ \t]+Provider|Actions|Constants|State|Types|Extensions?)[ \t]*$'
    message: "This MARK names the kind of member under it (Properties, Methods, Init, Preview), which the code already shows. Delete it, or name what the section is for (`// MARK: - Checkout`), or move a protocol's members into an extension named by the conformance."
    bad:
      - |-
        // MARK: - Properties
        let title: String
      - "// MARK: Private Methods"
      - "// MARK: - Preview"
    good:
      - "// MARK: - Payment sheet"
      - "// MARK: - AVCapturePhotoCaptureDelegate"

  - id: no-restating-comment
    check: restatingComment
    config: { maxWords: 6 }
    message: "This comment says what the next line already says. Delete it, or replace it with why the line is there (the reason, the constraint, the bug it avoids)."
    bad:
      - |-
        func refresh() {
            // Load the user profile
            loadUserProfile()
        }
      - |-
        func close() {
            // Dismiss
            dismiss()
        }
    good:
      - |-
        func refresh() {
            // The profile can change on the web, so reload it on every visit.
            loadUserProfile()
        }
      - |-
        func close() {
            // Keep the draft until the server confirms
            dismiss()
        }
