      - const db = postgres('postgres://postgres:postgres1@localhost:5432/dev');
      - const db = postgres(`postgres://${user}:${password}@${host}/app`);
      - const pub = loadStripe('pk_live_51HxQ2bLk8dPq3RtY7uVw9ZaB');
  - id: no-placeholder-comment
    pack: slop
    comment: \b(in a (real|production) (implementation|app|application|system|world|scenario)|placeholder (implementation|logic|for now|value)|(simplified|naive|dummy|mock|fake) implementation|this is (just )?a (stub|placeholder|mock)|for now,? (just|we|simply|return|use|hard-?code)|todo:? implement|not (yet )?implemented\b.*\b(later|todo)|would (normally|typically) (be|go|come|call|use)|(replace|swap) (this |it |that )?with (an? |the |your )?(actual|real)|for (demo|demonstration|illustration) purposes|in (a )?production,? (this|we|you|it) would)\b
    message: This comment admits the code is a stand-in, not the real thing. Write the real implementation, or stop and say what is missing; never leave a stub that looks finished.
    bad:
      - |-
        // In a real implementation, this would call the payment API
        const paid = true;
      - |-
        // Placeholder implementation
        export function total() { return 0; }
      - |-
        // For now, just return an empty list
        const items = [];
      - |-
        /* TODO: implement retry */
        send();
      - |-
        // TODO: Replace with actual API call
        const users = [];
      - |-
        // For demo purposes, return a fixed user
        const user = { id: 1 };
      - |-
        // In production, this would use Redis
        const cache = new Map();
    good:
      - |-
        // Retries twice, then gives up: the provider rate-limits a third attempt.
        send();
      - |-
        // The placeholder shown while the image loads.
        const blur = "data:image/png;base64,AAAA";
      - |-
        // Implements the provider's v2 signature scheme.
        sign();
      - |-
        // TODO(will): move to the queue once it supports delays
        send();
      - |-
        // In production the CDN serves this; locally Vite does.
        const base = '/';
      - |-
        // Replaced with the signed URL once the upload finishes.
        let src = preview;
