# Intersite's selector rules. One entry is one rule: no code needed.
#   id        unique, kebab-case
#   pack      tests | slop | security | runtime | actions | state
#   selector  ESLint-style syntax-tree selector; every match is reported
#   message   what is wrong AND what to do instead
#   files     optional path globs the rule is limited to
#   bad/good  code that must / must not be reported; `npm test` checks every one
rules:
  - id: no-focused-tests
    pack: tests
    selector: CallExpression[callee.property.name='only'][callee.object.name=/^(describe|suite|context|it|test|specify)$/], CallExpression[callee.property.name='only'][callee.object.object.name=/^(describe|suite|context|it|test|specify)$/], CallExpression[callee.object.property.name='only'][callee.object.object.name=/^(describe|suite|context|it|test|specify)$/], CallExpression[callee.name=/^(fit|fdescribe|ftest)$/][arguments.0.type=/^(Literal|TemplateLiteral)$/][arguments.1.type=/Function/], CallExpression[callee.name=/^(describe|suite|it|test)$/] > ObjectExpression > Property[key.name='only'][value.value=true]
    message: A focused test (.only) silently stops every other test from running. Remove the focus before committing.
    bad:
      - it.only('adds', () => { expect(add(1, 2)).toBe(3); });
      - describe.only('math', () => {});
      - fit('adds', () => { expect(add(1, 2)).toBe(3); });
      - "test('adds', { only: true }, () => { assert.equal(add(1, 2), 3); });"
      - test.describe.only('users', () => {});
      - it.concurrent.only('adds', async () => { expect(add(1, 2)).toBe(3); });
      - describe.only.each([1, 2])('n %i', (n) => {});
    good:
      - it('adds', () => { expect(add(1, 2)).toBe(3); });
      - const only = list.only(1);
      - const cls = cn(fit(column), 'cell');
  - id: no-skipped-tests
    pack: tests
    selector: CallExpression[callee.property.name=/^(skip|fixme)$/][callee.object.name=/^(describe|suite|context|it|test|specify)$/]:matches([arguments.length=0], [arguments.0.type=/^(Literal|TemplateLiteral)$/]), CallExpression[callee.property.name=/^(skip|fixme)$/][callee.object.object.name=/^(describe|suite|context|it|test|specify)$/]:matches([arguments.length=0], [arguments.0.type=/^(Literal|TemplateLiteral)$/]), CallExpression[callee.object.property.name='skip'][callee.object.object.name=/^(describe|suite|context|it|test|specify)$/], CallExpression[callee.name=/^(xit|xdescribe|xtest|xcontext|xspecify)$/], CallExpression[callee.name=/^(describe|suite|it|test)$/] > ObjectExpression > Property[key.name='skip']:matches([value.type='TemplateLiteral'], [value.type='BinaryExpression'][value.operator='+'], [value.type='Literal']:not([value.value=false]))
    message: "A skipped test proves nothing and rots. Fix it so it passes, or delete it and track the work in an issue. A skip that depends on the environment, as in test.skip(browserName === 'webkit', 'why') or { skip: !process.env.STRIPE_KEY }, is fine."
    bad:
      - it.skip('adds', () => { expect(add(1, 2)).toBe(3); });
      - xdescribe('math', () => {});
      - "test('adds', { skip: 'flaky' }, () => { assert.equal(add(1, 2), 3); });"
      - test.describe.skip('users', () => {});
      - test.fixme('saves', async ({ page }) => { await page.goto('/'); });
      - test('saves', async ({ page }) => { test.skip(); await page.goto('/'); });
      - "test('adds', { skip: 'needs a TikTok account ' + 'the QA stack lacks' }, () => {});"
      - describe.skip.each([1])('n %i', () => {});
    good:
      - it('adds', () => { expect(add(1, 2)).toBe(3); });
      - stream.skip(2);
      - test('copies', async ({ browserName }) => { test.skip(browserName === 'webkit', 'no clipboard API'); });
      - "test('uploads', { skip: uploadSkip }, async () => {});"
      - "test('adds', { skip: false }, () => {});"
  - id: no-constant-assertion
    pack: tests
    selector: CallExpression[callee.name='expect'][arguments.length=1][arguments.0.type='Literal'], CallExpression[callee.name='assert'][arguments.0.type='Literal']:not([arguments.0.value=false]), CallExpression[callee.object.name='assert'][callee.property.name='ok'][arguments.0.type='Literal']:not([arguments.0.value=false]), CallExpression[callee.object.name='assert'][callee.property.name=/^(equal|strictEqual|deepEqual|deepStrictEqual)$/][arguments.0.type='Literal'][arguments.1.type='Literal']
    message: This assertion checks a constant, so it can never fail. Assert on the value the code under test produced.
    bad:
      - expect(true).toBe(true);
      - assert(true);
      - assert.ok(1);
      - expect(1).toEqual(1);
      - assert.equal(1, 1);
    good:
      - expect(add(1, 2)).toBe(3);
      - assert.ok(result.ok);
      - assert.equal(add(1, 2), 3);
      - const me = parse(await expect(200, send('/v1/me')));
      - "await expect(422, send('/v1/creators/c1', { method: 'PATCH' }));"
      - assert.ok(false, 'parse should have thrown');
  - id: no-existence-only-assertion
    pack: tests
    selector: CallExpression[callee.property.name=/^(toBeDefined|toBeTruthy)$/]:not([callee.object.callee.property.name='poll'], CallExpression[callee.name='waitFor'] *), CallExpression[callee.object.property.name='not'][callee.property.name=/^(toBeUndefined|toBeNull|toBeFalsy)$/]:not([callee.object.object.callee.property.name='poll'], CallExpression[callee.name='waitFor'] *), CallExpression[callee.object.property.name='not'][callee.property.name=/^(toBe|toEqual|toStrictEqual)$/]:matches([arguments.0.type='Identifier'][arguments.0.name='undefined'], [arguments.0.type='Literal'][arguments.0.raw='null']):not([callee.object.object.callee.property.name='poll'], CallExpression[callee.name='waitFor'] *)
    message: Checking that a value exists or is truthy passes for almost any wrong value. Assert the exact expected value with toBe/toEqual, or for a generated value such as an ID or timestamp, its form with toMatch. Waiting for a value to appear is fine through expect.poll or waitFor.
    bad:
      - expect(user).toBeDefined();
      - expect(result.ok).toBeTruthy();
      - expect(user).not.toBeNull();
      - expect(user).not.toBeUndefined();
      - expect(user).not.toBe(null);
      - expect(user).not.toEqual(undefined);
    good:
      - "expect(user).toEqual({ id: 'u1', name: 'Ada' });"
      - expect(result.ok).toBe(true);
      - expect(find('missing')).toBeUndefined();
      - await expect.poll(() => imagePath(image)).not.toBeNull();
      - "await expect.poll(read, { timeout: 30_000 }).toBeTruthy();"
      - await waitFor(() => expect(result.current.data).toBeDefined());
      - expect(next).not.toBe(previous);
      - expect(next.id).not.toBe(previous.id);
      - expect(row.tagName).not.toBe('A');
  - id: no-module-mocking
    pack: tests
    selector: CallExpression[callee.object.name=/^(vi|jest)$/][callee.property.name=/^(mock|doMock|unstable_mockModule)$/], CallExpression[callee.object.name='mock'][callee.property.name='module'], CallExpression[callee.object.property.name='mock'][callee.property.name='module']
    message: Module mocking tests the mock, not the code. Pass the dependency in as a parameter, or run against a real or in-memory implementation.
    bad:
      - vi.mock('./db.js');
      - "jest.mock('../api', () => ({ get: jest.fn() }));"
      - "mock.module('./db.js', { namedExports: { query } });"
      - "t.mock.module('./db.js', { namedExports: { query } });"
    good:
      - const db = createMemoryDb();
      - const spy = vi.fn();
  - id: no-log-and-continue
    pack: slop
    selector: CatchClause > BlockStatement[body.length=1] > ExpressionStatement > CallExpression[callee.object.name=/^(console|logger|log)$/], CallExpression[callee.property.name='catch'] > MemberExpression[object.name=/^(console|logger|log)$/], CallExpression[callee.property.name='catch'] > :function > CallExpression.body[callee.object.name=/^(console|logger|log)$/], CallExpression[callee.property.name='catch'] > :function > BlockStatement.body[body.length=1] > ExpressionStatement > CallExpression[callee.object.name=/^(console|logger|log)$/]
    message: Logging an error and carrying on hides the failure from callers. Rethrow it, return an explicit error result, or let it propagate.
    bad:
      - try { save(); } catch (error) { console.error(error); }
      - save().catch(console.error);
      - save().catch((error) => console.warn(error));
      - save().catch((error) => { console.error(error); });
      - try { save(); } catch (error) { logger.error(error); }
    good:
      - try { save(); } catch (error) { console.error(error); throw error; }
      - try { save(); } catch (error) { console.error(error); process.exitCode = 1; }
      - save().catch((error) => { logger.error(error); throw error; });
  - id: no-as-any
    pack: slop
    selector: ":not(TSAsExpression, TSTypeAssertion) > TSAsExpression[typeAnnotation.type='TSAnyKeyword'], :not(TSAsExpression, TSTypeAssertion) > TSTypeAssertion[typeAnnotation.type='TSAnyKeyword']"
    message: Casting to any switches off type checking. Fix the type, narrow with a check, or describe the real shape.
    bad:
      - const user = data as any;
      - const user = <any>data;
      - const name = (data as any).name;
    good:
      - const user = data as User;
      - const user = parseUser(data);
  - id: no-double-assertion
    pack: slop
    selector: :matches(TSAsExpression, TSTypeAssertion)[expression.type=/^(TSAsExpression|TSTypeAssertion)$/][expression.typeAnnotation.type=/^TS(Unknown|Any)Keyword$/]
    message: Casting through unknown forces an unrelated type and hides a real mismatch. Validate the value or fix the types so one cast (or none) is enough.
    bad:
      - const user = data as unknown as User;
      - const user = data as any as User;
      - const user = <User><unknown>data;
      - const user = (<unknown>data) as User;
    good:
      - const user = data as User;
      - const value = input as unknown;
  - id: no-explicit-any
    pack: slop
    selector: :not(TSAsExpression, TSTypeAssertion) > TSAnyKeyword
    message: "An any type turns off checking for everything it touches. Use the real type, a generic, or unknown plus a check; a constraint for any function is `(...args: never[]) => unknown`."
    bad:
      - "function load(input: any) { return input; }"
      - "const items: Array<any> = [];"
      - "type Handler = (event: any) => void;"
      - "type Fn<T extends (...args: any[]) => any> = ReturnType<T>;"
    good:
      - "function load(input: unknown) { return input; }"
      - "const items: string[] = [];"
      - "type Fn<T extends (...args: never[]) => unknown> = ReturnType<T>;"
  - id: no-stub-implementation
    pack: slop
    selector: ThrowStatement > :matches(NewExpression, CallExpression)[callee.name=/Error$/] > Literal.arguments[value=/[Nn]ot (yet )?implemented|NOT IMPLEMENTED|[Uu]nimplemented|\bTODO\b|^[Tt]odo:/], ThrowStatement > :matches(NewExpression, CallExpression)[callee.name=/Error$/] > TemplateLiteral.arguments > TemplateElement[value.raw=/[Nn]ot (yet )?implemented|NOT IMPLEMENTED|[Uu]nimplemented|\bTODO\b|^[Tt]odo:/], ThrowStatement > NewExpression[callee.name=/^(NotImplemented|Unimplemented)/]
    message: This is a stub, not an implementation. Implement it, or delete it and the code that calls it.
    bad:
      - function charge() { throw new Error('Not implemented'); }
      - "function charge() { throw new Error('TODO: implement charge'); }"
      - "class Gateway { charge(): void { throw new Error('Method not implemented.'); } }"
      - function charge() { throw new Error(`Not implemented`); }
      - function charge() { throw Error('not implemented yet'); }
      - function charge() { throw new NotImplementedError(); }
    good:
      - function charge(amount) { if (amount <= 0) throw new Error('amount must be positive'); return pay(amount); }
      - function load(id) { if (!id) throw new Error('Todo list not found'); return find(id); }
  - id: no-hardcoded-secret
    pack: security
    selector: Literal[value=/\b((sk|rk)_live_[0-9A-Za-z]{16,}|whsec_[0-9A-Za-z+\/=]{24,}|gh[pousr]_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{40,}|(AKIA|ASIA)[0-9A-Z]{16}|xox[abposr]-[0-9A-Za-z-]{20,}|hooks\.slack\.com\/services\/T[0-9A-Z]{6,}\/B[0-9A-Z]{6,}\/[0-9A-Za-z]{20,}|sk-ant-[0-9A-Za-z_-]{20,}|sk-(proj|svcacct|admin)-[0-9A-Za-z_-]{20,}|sk-[0-9A-Za-z]{20}T3BlbkFJ[0-9A-Za-z]{20}|SG\.[0-9A-Za-z_-]{22}\.[0-9A-Za-z_-]{43}|sb_secret_[0-9A-Za-z_-]{20,}|AIza[0-9A-Za-z_-]{35}|npm_[0-9A-Za-z]{36}|glpat-[0-9A-Za-z_-]{20,})\b|-----BEGIN ([A-Z]+ )*PRIVATE KEY-----(\s|\\[nr])*[A-Za-z0-9+\/=]{40}|\b(postgres(ql)?|mysql|mongodb(\+srv)?|rediss?|amqps?):\/\/[^:\/\s@]+:(?=[^@\s\/]{8,}@)(?=[^@\s\/]*[0-9])(?=[^@\s\/]*[A-Za-z])[^@\s\/$]+@(?!(localhost|127\.0\.0\.1|host|db|postgres|mysql|redis|mongo)([:\/]|$))/]:not([value=/x{8}|X{8}|\*{4}|\.\.\.|your[-_ ]|replace|placeholder|dummy|fake|redacted|<[a-z_-]+>/i]):not([value=/EXAMPLE/]), TemplateElement[value.raw=/\b((sk|rk)_live_[0-9A-Za-z]{16,}|whsec_[0-9A-Za-z+\/=]{24,}|gh[pousr]_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{40,}|(AKIA|ASIA)[0-9A-Z]{16}|xox[abposr]-[0-9A-Za-z-]{20,}|hooks\.slack\.com\/services\/T[0-9A-Z]{6,}\/B[0-9A-Z]{6,}\/[0-9A-Za-z]{20,}|sk-ant-[0-9A-Za-z_-]{20,}|sk-(proj|svcacct|admin)-[0-9A-Za-z_-]{20,}|sk-[0-9A-Za-z]{20}T3BlbkFJ[0-9A-Za-z]{20}|SG\.[0-9A-Za-z_-]{22}\.[0-9A-Za-z_-]{43}|sb_secret_[0-9A-Za-z_-]{20,}|AIza[0-9A-Za-z_-]{35}|npm_[0-9A-Za-z]{36}|glpat-[0-9A-Za-z_-]{20,})\b|-----BEGIN ([A-Z]+ )*PRIVATE KEY-----(\s|\\[nr])*[A-Za-z0-9+\/=]{40}|\b(postgres(ql)?|mysql|mongodb(\+srv)?|rediss?|amqps?):\/\/[^:\/\s@]+:(?=[^@\s\/]{8,}@)(?=[^@\s\/]*[0-9])(?=[^@\s\/]*[A-Za-z])[^@\s\/$]+@(?!(localhost|127\.0\.0\.1|host|db|postgres|mysql|redis|mongo)([:\/]|$))/]:not([value.raw=/x{8}|X{8}|\*{4}|\.\.\.|your[-_ ]|replace|placeholder|dummy|fake|redacted|<[a-z_-]+>/i]):not([value.raw=/EXAMPLE/])
    message: "This looks like a live credential (an API key, private key or a connection string with its password) in source code, where anyone with the repository has it. Rotate it now, then read it from an environment variable or secret store. Tests use test-mode keys such as sk_test_, and a placeholder such as sk_live_xxxxxxxx is ignored."
    bad:
      - const stripe = new Stripe('sk_live_51HxQ2bLk8dPq3RtY7uVw9ZaB');
      - const token = 'ghp_aB3dE5fG7hJ9kL1mN3pQ5rS7tU9vW1xY3zA5';
      - "const aws = { accessKeyId: 'AKIAQ7XKZ2M4PL9RT3VW' };"
      - const slack = `xoxb-2741936517-5829104736281-Qz8LmN4pRt7Vx2Kc`;
      - const key = '-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA7vbqajDw4o6gJy8UtmIbkcpnkO3Kwc4qsEnSZp\n-----END RSA PRIVATE KEY-----';
      - const key = `-----BEGIN PRIVATE KEY-----\nMIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQg`;
      - "fetch(url, { headers: { authorization: 'Bearer github_pat_11ABCDEFG0123456789_abcdefghijklmnopqrstuvwxyzABCDEF' } });"
      - const webhookSecret = 'whsec_9fK2LmQp7RtXv3NbZc8YdWa1EeHg4Js6';
      - "const openai = new OpenAI({ apiKey: 'sk-svcacct-Ab3dE5fG7hJ9kL1mN3pQ5rS7tU9vW1xY' });"
      - const mail = 'SG.Ab3dE5fG7hJ9kL1mN3pQ5r.S7tU9vW1xY3zA5bC7dE9fG1hJ3kL5mN7pQ9rS1tU3vW';
      - const alerts = 'https://hooks.slack.com/services/T024BE7LD/B01ABCDEF12/Ab3dE5fG7hJ9kL1mN3pQ5rS7';
      - const admin = createClient(url, 'sb_secret_Ab3dE5fG7hJ9kL1mN3pQ5rS7tU9vW1');
      - const db = postgres('postgres://admin:S3cr3tPassw0rd!@db.internal.acme.io:5432/prod');
    good:
      - const stripe = new Stripe('sk_test_51HxQ2bLk8dPq3RtY7uVw9ZaB');
      - const stripe = new Stripe(process.env.STRIPE_SECRET_KEY);
      - if (key.startsWith('sk_live_')) throw new Error('live key in test');
      - const pattern = /ghp_[0-9A-Za-z]{36}/;
      - const label = 'AKIA prefix marks an AWS access key';
      - const body = pem.replace('-----BEGIN PRIVATE KEY-----', '').replace('-----END PRIVATE KEY-----', '');
      - const pem = `-----BEGIN PRIVATE KEY-----\n${base64(der)}\n-----END PRIVATE KEY-----`;
      - const header = '-----BEGIN RSA PRIVATE KEY-----\n';
      - const stripe = new Stripe('sk_live_xxxxxxxxxxxxxxxxxxxxxxxx');
