# Security mistakes in web servers and clients (pack `security`), and in Next.js and other server-action frameworks
# (pack `next`). Same format as core.yml; `builtin` switches on rules oxlint already ships.
rules:
  - id: no-secret-in-public-env
    pack: security
    selector: MemberExpression[computed=false][property.name=/^(NEXT_PUBLIC|VITE|EXPO_PUBLIC|REACT_APP|GATSBY|NUXT_PUBLIC|PUBLIC)_\w*(SECRET|PRIVATE_KEY|PASSWORD|PASSWD|SERVICE_ROLE|SERVICE_KEY|DATABASE_URL|(OPENAI|ANTHROPIC|GROQ|REPLICATE|OPENROUTER|RESEND|SENDGRID|MAILGUN|POSTMARK|ELEVENLABS|DEEPSEEK|MISTRAL|COHERE|PERPLEXITY|TWILIO|AIRTABLE|GITHUB)_\w*(KEY|TOKEN))/], ObjectPattern > Property[key.name=/^(NEXT_PUBLIC|VITE|EXPO_PUBLIC|REACT_APP|GATSBY|NUXT_PUBLIC|PUBLIC)_\w*(SECRET|PRIVATE_KEY|PASSWORD|PASSWD|SERVICE_ROLE|SERVICE_KEY|DATABASE_URL|(OPENAI|ANTHROPIC|GROQ|REPLICATE|OPENROUTER|RESEND|SENDGRID|MAILGUN|POSTMARK|ELEVENLABS|DEEPSEEK|MISTRAL|COHERE|PERPLEXITY|TWILIO|AIRTABLE|GITHUB)_\w*(KEY|TOKEN))/]
    message: 'A variable with a public prefix (NEXT_PUBLIC_, VITE_, EXPO_PUBLIC_, PUBLIC_) is copied into the browser bundle, and this one''s name says it is a secret. Drop the prefix, read it only in server code (a route, server action or server function), and rotate it if it has shipped. Publishable, anon and public keys are fine.'
    bad:
      - const supabase = createClient(url, process.env.NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY);
      - "const openai = new OpenAI({ apiKey: import.meta.env.VITE_OPENAI_API_KEY });"
      - const stripe = new Stripe(process.env.NEXT_PUBLIC_STRIPE_SECRET_KEY);
      - const { EXPO_PUBLIC_ADMIN_PASSWORD } = process.env;
      - const db = postgres(process.env.PUBLIC_DATABASE_URL);
    good:
      - const supabase = createClient(url, process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY);
      - const stripe = loadStripe(import.meta.env.VITE_STRIPE_PUBLISHABLE_KEY);
      - const admin = createClient(url, process.env.SUPABASE_SERVICE_ROLE_KEY);
      - "const maps = load({ key: process.env.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY });"
      - const verify = importSPKI(process.env.PUBLIC_KEY, 'RS256');
  - id: no-disabled-tls-verification
    pack: security
    selector: Property[key.name='rejectUnauthorized'][value.value=false], AssignmentExpression[left.property.name='NODE_TLS_REJECT_UNAUTHORIZED']:matches([right.value='0'], [right.value=0]), Property:matches([key.name='NODE_TLS_REJECT_UNAUTHORIZED'], [key.value='NODE_TLS_REJECT_UNAUTHORIZED']):matches([value.value='0'], [value.value=0])
    message: "This turns off TLS certificate checks, so anyone on the network path can impersonate the server and read or change the traffic. Keep verification on; for a private or self-signed certificate pass its CA (`ssl: { ca }`, `new https.Agent({ ca })`)."
    bad:
      - "const pool = new Pool({ connectionString, ssl: { rejectUnauthorized: false } });"
      - process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0';
      - "const agent = new https.Agent({ rejectUnauthorized: false });"
      - "spawn('node', ['job.js'], { env: { ...process.env, NODE_TLS_REJECT_UNAUTHORIZED: '0' } });"
    good:
      - "const pool = new Pool({ connectionString, ssl: { ca: readCa() } });"
      - "const pool = new Pool({ connectionString, ssl: { rejectUnauthorized: true } });"
      - process.env.NODE_TLS_REJECT_UNAUTHORIZED = '1';
      - "const agent = new https.Agent({ rejectUnauthorized: process.env.NODE_ENV === 'production' });"
  - id: no-fast-password-hash
    pack: security
    selector: CallExpression[callee.property.name='update']:matches([callee.object.callee.name='createHash'], [callee.object.callee.property.name='createHash']):matches([arguments.0.name=/pass(word|wd|code)$|^pwd$/i], [arguments.0.property.name=/pass(word|wd|code)$|^pwd$/i]), CallExpression[callee.property.name='digest'][callee.object.property.name='subtle']:has(Identifier[name=/pass(word|wd|code)$|^pwd$/i])
    message: 'A plain hash (MD5, SHA-1, even SHA-256) of a password can be brute-forced at billions of guesses a second once the table leaks. Use a slow, salted password hash such as crypto.scrypt, argon2 or bcrypt, and compare with its verify function.'
    bad:
      - const hash = createHash('sha256').update(password).digest('hex');
      - const hash = crypto.createHash('md5').update(req.body.password).digest('hex');
      - const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(password));
      - const stored = createHash('sha1').update(user.passwd).digest('base64');
    good:
      - const hash = await argon2.hash(password);
      - const hash = createHash('sha256').update(rawToken).digest('hex');
      - "const key = scryptSync(password, salt, 64);"
      - const etag = createHash('md5').update(body).digest('hex');
      - const stored = createHash('sha256').update(passwordResetToken).digest('hex');
  - id: no-shell-injection
    pack: security
    selector: CallExpression:matches([callee.name=/^(exec|execSync|execAsync|execPromise)$/], [callee.property.name=/^(exec|execSync)$/][callee.object.name=/^(child_?process|cp|childProcess)$/]) > TemplateLiteral.arguments:has(> .expressions:not(Identifier[name=/^[A-Z][A-Z0-9_]*$/])), CallExpression:matches([callee.name=/^(exec|execSync|execAsync|execPromise)$/], [callee.property.name=/^(exec|execSync)$/][callee.object.name=/^(child_?process|cp|childProcess)$/]) > BinaryExpression.arguments[operator='+']
    message: 'This builds a shell command from a string, so a value containing ; or $( ) runs its own commands. Use execFile or spawn with the arguments as an array (execFile(''git'', [''log'', ref])), which never goes through a shell.'
    bad:
      - exec(`convert ${input} out.png`);
      - "const out = execSync(`git log ${branch} --oneline`, { encoding: 'utf8' });"
      - child_process.exec('rm -rf ' + dir);
      - execSync('ffmpeg -i ' + file + ' out.mp4');
      - const { stdout } = await execAsync(`du -sh ${path}`);
    good:
      - execFile('convert', [input, 'out.png']);
      - execSync('git rev-parse HEAD');
      - execSync(`npm run ${SCRIPT_NAME}`);
      - const match = pattern.exec(`${first} ${last}`);
      - const row = await db.exec(`SELECT 1`);
  - id: no-insecure-session-cookie
    pack: security
    selector: CallExpression:matches([callee.property.name='cookie'], [callee.property.name='set'][callee.object.callee.name='cookies'], [callee.property.name='set'][callee.object.property.name='cookies'], [callee.property.name='set'][callee.object.name='cookieStore'], [callee.property.name='set'][callee.object.argument.callee.name='cookies'])[arguments.0.value=/(^|[-_.])(session|sess|sid|token|jwt|auth|access|refresh)([-_.]|$)|(session|token|auth)$/i]:not([arguments.0.value=/csrf|xsrf/i]):not([arguments.1.value='']):not(:has(Property[key.name='httpOnly'][value.value=true])):not(:has(SpreadElement)):not([arguments.2.type='Identifier']):not([arguments.2.type='MemberExpression']), CallExpression[callee.name='setCookie'][arguments.1.value=/(^|[-_.])(session|sess|sid|token|jwt|auth|access|refresh)([-_.]|$)|(session|token|auth)$/i]:not([arguments.1.value=/csrf|xsrf/i]):not([arguments.2.value='']):not(:has(Property[key.name='httpOnly'][value.value=true])):not(:has(SpreadElement)):not([arguments.3.type='Identifier']):not([arguments.3.type='MemberExpression'])
    message: 'A session or token cookie without httpOnly: true can be read by any script on the page, so one XSS bug hands over the session. Set { httpOnly: true, secure: true, sameSite: "lax" } (secure may follow NODE_ENV for local http).'
    bad:
      - res.cookie('session', token);
      - "cookies().set('auth-token', jwt, { secure: true });"
      - "setCookie(c, 'refresh_token', token, { path: '/' });"
      - "res.cookie('sid', id, { httpOnly: false, secure: true });"
      - "(await cookies()).set('accessToken', token, { maxAge: 3600 });"
    good:
      - "res.cookie('session', token, { httpOnly: true, secure: true, sameSite: 'lax' });"
      - "cookies().set('theme', 'dark');"
      - res.cookie('session', token, sessionCookieOptions);
      - "setCookie(c, 'refresh_token', token, { ...COOKIE_DEFAULTS, maxAge: 3600 });"
      - "res.cookie('tokenizer_hint', 'on');"
      - "res.cookie('XSRF-TOKEN', req.csrfToken(), { secure: true });"
      - "map.set('session', value);"
      - "res.cookie('session', '', { maxAge: 0 });"
builtin:
  - { rule: eslint/no-eval, pack: security }
  - { rule: eslint/no-new-func, pack: security }
