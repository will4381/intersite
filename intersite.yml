# yaml-language-server: $schema=./intersite.schema.json
project: intersite

gates:
  testCmd: npm test
  acknowledged:
    - { gate: new-deps, target: yaml, why: "parses intersite.yml and lint/rules.yml; Node has no YAML parser and a hand-written one would be a bug farm" }
    - { gate: new-deps, target: playwright-core, why: "optional peer that drives the installed Chrome for the ui replay mode; a dev dependency here only so that mode is tested" }
    - { gate: test-integrity, target: test/gates/duplicates.test.mjs, why: "dropped a CPU-time limit that failed on a saturated machine; the test still checks the finding on 3,000 files and prints the time" }
    - { gate: test-integrity, target: test/gates/similar.test.mjs, why: "dropped a CPU-time limit that failed on a saturated machine; the test still checks the finding on 4,000 files and prints the time" }
    - { gate: test-integrity, target: test/gates/unused.test.mjs, why: "dropped a CPU-time limit that failed on a saturated machine; the test still checks the finding on 4,000 files and prints the time" }
