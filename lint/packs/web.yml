# Security mistakes in web servers and clients (pack `security`), and in Next.js and other server-action frameworks
# (pack `next`). Same format as core.yml; `builtin` switches on rules oxlint already ships.
rules:
  - id: no-secret-in-public-env
    pack: security
    selector: MemberExpression[computed=false][property.name=/^(NEXT_PUBLIC|VITE|EXPO_PUBLIC|REACT_APP|GATSBY|NUXT_PUBLIC|PUBLIC)_\w*(SECRET|PRIVATE_KEY|PASSWORD|PASSWD|SERVICE_ROLE|SERVICE_KEY|DATABASE_URL|ADMIN_(TOKEN|KEY)|(OPENAI|ANTHROPIC|GROQ|REPLICATE|OPENROUTER|RESEND|SENDGRID|MAILGUN|POSTMARK|ELEVENLABS|DEEPSEEK|MISTRAL|COHERE|PERPLEXITY|TWILIO|AIRTABLE|GITHUB)_\w*(KEY|TOKEN))/], MemberExpression[computed=true][property.value=/^(NEXT_PUBLIC|VITE|EXPO_PUBLIC|REACT_APP|GATSBY|NUXT_PUBLIC|PUBLIC)_\w*(SECRET|PRIVATE_KEY|PASSWORD|PASSWD|SERVICE_ROLE|SERVICE_KEY|DATABASE_URL|ADMIN_(TOKEN|KEY)|(OPENAI|ANTHROPIC|GROQ|REPLICATE|OPENROUTER|RESEND|SENDGRID|MAILGUN|POSTMARK|ELEVENLABS|DEEPSEEK|MISTRAL|COHERE|PERPLEXITY|TWILIO|AIRTABLE|GITHUB)_\w*(KEY|TOKEN))/], ObjectPattern > Property[key.name=/^(NEXT_PUBLIC|VITE|EXPO_PUBLIC|REACT_APP|GATSBY|NUXT_PUBLIC|PUBLIC)_\w*(SECRET|PRIVATE_KEY|PASSWORD|PASSWD|SERVICE_ROLE|SERVICE_KEY|DATABASE_URL|ADMIN_(TOKEN|KEY)|(OPENAI|ANTHROPIC|GROQ|REPLICATE|OPENROUTER|RESEND|SENDGRID|MAILGUN|POSTMARK|ELEVENLABS|DEEPSEEK|MISTRAL|COHERE|PERPLEXITY|TWILIO|AIRTABLE|GITHUB)_\w*(KEY|TOKEN))/]
    message: 'A variable with a public prefix (NEXT_PUBLIC_, VITE_, EXPO_PUBLIC_, PUBLIC_) is copied into the browser bundle, and this one''s name says it is a secret. Drop the prefix, read it only in server code (a route, server action or server function), and rotate it if it has shipped. Publishable, anon and public keys are fine.'
    bad:
      - const supabase = createClient(url, process.env.NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY);
      - "const openai = new OpenAI({ apiKey: import.meta.env.VITE_OPENAI_API_KEY });"
      - const stripe = new Stripe(process.env.NEXT_PUBLIC_STRIPE_SECRET_KEY);
      - const { EXPO_PUBLIC_ADMIN_PASSWORD } = process.env;
      - const db = postgres(process.env.PUBLIC_DATABASE_URL);
      - const key = process.env['NEXT_PUBLIC_OPENAI_API_KEY'];
      - const admin = process.env.NEXT_PUBLIC_ADMIN_TOKEN;
    good:
      - const supabase = createClient(url, process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY);
      - const stripe = loadStripe(import.meta.env.VITE_STRIPE_PUBLISHABLE_KEY);
      - const admin = createClient(url, process.env.SUPABASE_SERVICE_ROLE_KEY);
      - "const maps = load({ key: process.env.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY });"
      - const verify = importSPKI(process.env.PUBLIC_KEY, 'RS256');
      - "const map = new mapboxgl.Map({ accessToken: process.env.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN });"
  - id: no-disabled-tls-verification
    pack: security
    selector: Property[key.name='rejectUnauthorized'][value.value=false], AssignmentExpression:matches([left.property.name='NODE_TLS_REJECT_UNAUTHORIZED'], [left.property.value='NODE_TLS_REJECT_UNAUTHORIZED']):matches([right.value='0'], [right.value=0]), Property:matches([key.name='NODE_TLS_REJECT_UNAUTHORIZED'], [key.value='NODE_TLS_REJECT_UNAUTHORIZED']):matches([value.value='0'], [value.value=0]), Property[key.name='checkServerIdentity'] > ArrowFunctionExpression.value[body.type='Identifier'][body.name='undefined'], Property[key.name='checkServerIdentity'] > :matches(ArrowFunctionExpression, FunctionExpression).value[body.type='BlockStatement'][body.body.length=0]
    message: "This turns off TLS certificate checks, so anyone on the network path can impersonate the server and read or change the traffic. Keep verification on; for a private or self-signed certificate pass its CA (`ssl: { ca }`, `new https.Agent({ ca })`)."
    bad:
      - "const pool = new Pool({ connectionString, ssl: { rejectUnauthorized: false } });"
      - process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0';
      - "const agent = new https.Agent({ rejectUnauthorized: false });"
      - "spawn('node', ['job.js'], { env: { ...process.env, NODE_TLS_REJECT_UNAUTHORIZED: '0' } });"
      - process.env['NODE_TLS_REJECT_UNAUTHORIZED'] = '0';
      - "const socket = tls.connect({ host, port, checkServerIdentity: () => undefined });"
    good:
      - "const pool = new Pool({ connectionString, ssl: { ca: readCa() } });"
      - "const pool = new Pool({ connectionString, ssl: { rejectUnauthorized: true } });"
      - process.env.NODE_TLS_REJECT_UNAUTHORIZED = '1';
      - "const agent = new https.Agent({ rejectUnauthorized: process.env.NODE_ENV === 'production' });"
      - "const socket = tls.connect({ host, port, checkServerIdentity: (host, cert) => pin(cert) });"
builtin:
  - { rule: eslint/no-eval, pack: security }
  - { rule: eslint/no-new-func, pack: security }
